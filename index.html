<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#ffffff" />
  <title>Biblioteca de Provões</title>
  <link rel="stylesheet" href="motion-host.css?v=20261021-v2" />
</head>
<body>
  <iframe id="appFrame" title="Biblioteca de Provões"></iframe>

  <script>
    (async () => {
      const frame = document.getElementById('appFrame');
      try {
        const r = await fetch('app.html?v=20261031-nav-after-result-v4', { cache: 'no-store' });
        if (!r.ok) throw new Error('Não foi possível carregar o aplicativo.');
        const html = await r.text();
        frame.srcdoc = html
          .replace('motion.css?v=20261021-v1', 'motion.css?v=20261026-unified-v4')
          .replace('motion.js?v=20261021-v1', 'motion.js?v=20261026-extra-comment-v4')
          .replace('comments.js?v=20261020-tour-1', 'comments.js?v=20261021-admin-2');
      } catch (e) {
        document.body.innerHTML = '<p style="font:16px system-ui;padding:24px">Não foi possível carregar a biblioteca agora. Atualize a página.</p>';
      }
    })();
  </script>
  <script src="sync.js?v=20261023-loading-v4"></script>
  <script src="features.js?v=20261020-acervo-17-v2"></script>
  <script src="tutorial.js?v=20261021-guia-2"></script>
</body>
</html>
